name: Build CallBridge Server APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build tinymix (arm64) for root audio routing
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/tinyalsa/tinyalsa.git /tmp/tinyalsa
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          cd /tmp/tinyalsa
          $CC -O2 -static -Iinclude -o tinymix \
            utils/tinymix.c src/mixer.c src/mixer_hw.c src/pcm.c src/pcm_hw.c
          file tinymix
          mkdir -p $GITHUB_WORKSPACE/app/src/main/assets
          cp tinymix $GITHUB_WORKSPACE/app/src/main/assets/tinymix

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > callbridge.keystore

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallBridgeServer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Magisk module (privileged install)
        run: |
          mkdir -p magisk/system/priv-app/CallBridgeServer
          cp app/build/outputs/apk/debug/app-debug.apk magisk/system/priv-app/CallBridgeServer/CallBridgeServer.apk
          cd magisk && zip -r ../CallBridgeServer-magisk.zip . -x '.*'

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: CallBridgeServer-magisk
          path: CallBridgeServer-magisk.zip
          retention-days: 30
